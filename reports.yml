name: Hisobotlar

on:
  schedule:
    - cron: "15 19 * * *"   # har kuni 00:15 (Toshkent) - o'tgan kun hisoboti
    - cron: "0 4 * * 1"     # dushanba 09:00 (Toshkent) - o'tgan hafta hisoboti
  workflow_dispatch:
    inputs:
      command:
        description: "Qaysi buyruq (birinchi marta: test)"
        type: choice
        default: test
        options: [test, today, week, month, daily, weekly, chatid]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ishga tushirish
        env:
          AMO_BASE_URL: ${{ secrets.AMO_BASE_URL }}
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PIPELINE_NAME: ${{ vars.PIPELINE_NAME }}
          DELIVERED_STAGE: ${{ vars.DELIVERED_STAGE }}
          NEW_STAGE: ${{ vars.NEW_STAGE }}
          MISSED_STAGE: ${{ vars.MISSED_STAGE }}
          HISTORY_FROM: ${{ vars.HISTORY_FROM }}
          PRICE_CAP: ${{ vars.PRICE_CAP }}
        run: |
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then
            if [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then CMD=weekly; else CMD=daily; fi
          fi
          python -m app.main "$CMD"
